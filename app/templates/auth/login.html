{% extends "base.html" %}
{% block title %}Agent Login — Property Antalya{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-100 rounded-2xl mb-4">
        <svg class="w-7 h-7 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Agent Login</h1>
      <p class="text-gray-500 text-sm mt-1">Sign in to manage your listings</p>
    </div>

    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8">
      {% if error %}
      <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3 mb-5">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-5">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1.5">Email</label>
          <input type="email" name="email" required autofocus
                 class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1.5">Password</label>
          <input type="password" name="password" required
                 class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </div>
        <button type="submit"
                class="w-full bg-primary text-white font-semibold py-2.5 rounded-xl hover:bg-blue-700 transition-colors text-sm">
          Sign In
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-400">Demo credentials:</p>
        <p class="text-xs text-gray-500 mt-1 font-mono">mehmet@property-antalya.com / Agent123!</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
