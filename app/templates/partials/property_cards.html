{% if properties %}
  {% for prop in properties %}
    {% include "partials/property_card.html" %}
  {% endfor %}
{% else %}
  <div class="col-span-3 py-20 text-center text-gray-400">
    <svg class="w-12 h-12 mx-auto mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <p class="font-semibold text-gray-500">No properties found</p>
    <p class="text-sm mt-1">Try adjusting your filters</p>
  </div>
{% endif %}
