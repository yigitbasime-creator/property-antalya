{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8 flex gap-8">

  <!-- Sidebar -->
  <aside class="w-56 shrink-0">
    <nav class="bg-white rounded-2xl border border-gray-100 shadow-sm p-3 space-y-1 sticky top-20">
      <div class="px-3 py-2 mb-2">
        <p class="text-xs text-gray-400 uppercase tracking-wide">Dashboard</p>
        <p class="font-semibold text-gray-800 text-sm mt-0.5">{{ user.first_name }} {{ user.last_name }}</p>
      </div>
      <a href="/dashboard"
         class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors
                {% if active == 'home' %}bg-blue-50 text-primary{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Overview
      </a>
      <a href="/dashboard/listings"
         class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors
                {% if active == 'listings' %}bg-blue-50 text-primary{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        My Listings
      </a>
      <a href="/dashboard/inquiries"
         class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors
                {% if active == 'inquiries' %}bg-blue-50 text-primary{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        Inquiries
      </a>
      <div class="border-t border-gray-100 pt-2 mt-2">
        <a href="/logout"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-red-500 hover:bg-red-50 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Logout
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main -->
  <div class="flex-1 min-w-0">
    {% block dashboard_content %}{% endblock %}
  </div>
</div>
{% endblock %}
